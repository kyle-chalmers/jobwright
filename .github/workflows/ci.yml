name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      # bin/selftest.sh runs ruff + pytest + the adapter-contract + skill-leak checks.
      - name: Selftest
        run: bash bin/selftest.sh

  package:
    # The artifact scan builds, so it runs once here rather than in every matrix leg.
    # A clean tree is not a clean package: the sdist ships a wider file set than the
    # tree checks inspect, and that is how local state leaked into 0.1.x.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Selftest with artifact scan
        env:
          JOBWRIGHT_SELFTEST_ARTIFACTS: "1"
        run: bash bin/selftest.sh

  # Validated as marketplace AND as plugin, because one root target cannot do both: it
  # resolves to marketplace.json and never reads plugin content.
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # This repo is BOTH a plugin and a single-plugin marketplace. A root-directory target
      # resolves to marketplace.json in preference to plugin.json and never reads skills or
      # hooks, so the old "claude plugin validate . --strict" passed even with a garbage
      # SKILL.md. There is no flag to force plugin mode -- name each manifest explicitly.
      - name: Marketplace manifest (strict)
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Plugin manifest + skills + hooks (strict)
        run: claude plugin validate .claude-plugin/plugin.json --strict

      # Negative control: if this ever passes, the gate above has stopped reading skill
      # content and every green tick on it is meaningless. Runs against a throwaway tree.
      - name: "Negative control: corrupt skill must fail validation"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          # sort between find and head is deliberate: it consumes all of find's output, so
          # find is never SIGPIPEd by head closing early (which pipefail would treat as a
          # step failure). It also makes the choice of victim deterministic across runs.
          victim="$(find "$tmp/skills" -type f -name SKILL.md | sort | head -n 1)"
          test -f "$victim"
          cp tests/plugin-validate-negative/broken-SKILL.md "$victim"
          out="$tmp/validate.out"
          if claude plugin validate "$tmp/.claude-plugin/plugin.json" --strict >"$out" 2>&1; then
            echo "::error::Negative control PASSED. The plugin-validate gate is not reading skill content."
            cat "$out"
            exit 1
          fi
          # A non-zero exit is not enough on its own -- a missing file, a CLI error or any
          # unrelated validation failure would also be non-zero and would silently look like
          # proof. Require that it failed for THIS reason: naming the skill we corrupted, with
          # a frontmatter diagnostic.
          if ! grep -qF "${victim#"$tmp"/}" "$out"; then
            echo "::error::Validation failed but never named the corrupted skill -- wrong reason."
            cat "$out"
            exit 1
          fi
          if ! grep -qiE 'frontmatter|yaml' "$out"; then
            echo "::error::Validation failed without a frontmatter/YAML diagnostic -- wrong reason."
            cat "$out"
            exit 1
          fi
          echo "Negative control OK: corrupt frontmatter rejected, and the diagnostic named the skill."
